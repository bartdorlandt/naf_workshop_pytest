[project]
name = "naf-workshop-pytest"
version = "0.1.0"
description = "NAF Workshop 08.06.2026"
authors = [
    { name = "ubaumann", email = "github@m.ubaumann.ch" },
    { name = "Bart Dorlandt", email = "dream@dreamnetworking.nl" },
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "napalm>=5.1.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "pyyaml>=6.0.3",
    "ruff>=0.15.14",
    "types-pyyaml",
]

[dependency-groups]
dev = ["mypy>=2.1.0", "ruff>=0.15.14"]
doc = [
    "mkdocs>=1.6.0",
    "mkdocs-material[imaging]>=9.5.31",
    "mkdocs-with-pdf>=0.9.3",
    "weasyprint>=68.1",
]
